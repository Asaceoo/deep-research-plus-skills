<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Deep Research Plus 流水线与闸门">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#93a3b5"/>
    </marker>
  </defs>
  <rect width="880" height="300" fill="#ffffff"/>
  <text x="24" y="34" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#1f2933">深度调研流水线：五道闸门，非零退出码即停</text>
  <text x="24" y="56" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5b6b7c">阶段推进由 scripts/drp.py 的退出码裁决，不依赖模型自觉</text>

  <!-- connectors -->
  <g stroke="#93a3b5" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="152" y1="132" x2="168" y2="132"/>
    <line x1="296" y1="132" x2="312" y2="132"/>
    <line x1="440" y1="132" x2="456" y2="132"/>
    <line x1="584" y1="132" x2="600" y2="132"/>
    <line x1="728" y1="132" x2="744" y2="132"/>
  </g>

  <!-- Phase 0 -->
  <g>
    <rect x="20" y="92" width="132" height="80" rx="10" fill="#f7f9fc" stroke="#d6dee8"/>
    <text x="34" y="116" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5b6b7c">PHASE 0</text>
    <text x="34" y="140" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2933">意图分档</text>
    <text x="34" y="160" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5b6b7c">light / standard / deep</text>
  </g>

  <!-- Phase 1 -->
  <g>
    <rect x="164" y="92" width="132" height="80" rx="10" fill="#f7f9fc" stroke="#d6dee8"/>
    <text x="178" y="116" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5b6b7c">PHASE 1</text>
    <text x="178" y="140" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2933">大纲与字段</text>
    <text x="178" y="160" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5b6b7c">含 1 个反方条目</text>
  </g>

  <!-- Phase 2 -->
  <g>
    <rect x="308" y="92" width="132" height="80" rx="10" fill="#fff7ed" stroke="#f0b429"/>
    <text x="322" y="116" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#b45309">PHASE 2 · 硬停</text>
    <text x="322" y="140" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2933">用户确认</text>
    <text x="322" y="160" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5b6b7c">confirmed 落盘</text>
  </g>

  <!-- Phase 3 -->
  <g>
    <rect x="452" y="92" width="132" height="80" rx="10" fill="#f7f9fc" stroke="#d6dee8"/>
    <text x="466" y="116" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#5b6b7c">PHASE 3</text>
    <text x="466" y="140" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2933">并行深调</text>
    <text x="466" y="160" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5b6b7c">一手来源优先</text>
  </g>

  <!-- Phase 3.5 -->
  <g>
    <rect x="596" y="92" width="132" height="80" rx="10" fill="#fff7ed" stroke="#f0b429"/>
    <text x="610" y="116" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#b45309">PHASE 3.5 · 硬停</text>
    <text x="610" y="140" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2933">反方评审</text>
    <text x="610" y="160" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5b6b7c">证据绑定 + 2 轮上限</text>
  </g>

  <!-- Phase 4 -->
  <g>
    <rect x="740" y="92" width="120" height="80" rx="10" fill="#eef4ff" stroke="#b9cdf5"/>
    <text x="754" y="116" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#1d4ed8">PHASE 4</text>
    <text x="754" y="140" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2933">六章报告</text>
    <text x="754" y="160" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5b6b7c">尾注逐条可点</text>
  </g>

  <!-- gate labels -->
  <g font-family="Consolas, Menlo, monospace" font-size="11" fill="#b45309">
    <text x="164" y="212">gate outline</text>
    <text x="308" y="212">gate confirm</text>
    <text x="452" y="212">gate results</text>
    <text x="596" y="212">gate review</text>
    <text x="740" y="212">gate report</text>
  </g>
  <g stroke="#f0b429" stroke-width="1.5" stroke-dasharray="3 3">
    <line x1="230" y1="180" x2="230" y2="196"/>
    <line x1="374" y1="180" x2="374" y2="196"/>
    <line x1="518" y1="180" x2="518" y2="196"/>
    <line x1="662" y1="180" x2="662" y2="196"/>
    <line x1="800" y1="180" x2="800" y2="196"/>
  </g>

  <text x="24" y="250" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5b6b7c">退出码 0 放行 · 1 有违规停在原地补齐 · 2 用法或环境错误</text>
  <text x="24" y="272" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5b6b7c">无命令执行能力的平台：全部闸门降级为人工复核，报告头标注 manual-gate</text>
</svg>
