<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="调研产物、工具链与发布产物">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#93a3b5"/>
    </marker>
  </defs>
  <rect width="880" height="330" fill="#ffffff"/>
  <text x="24" y="34" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#1f2933">从调研工作区到可校验的发布产物</text>
  <text x="24" y="56" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5b6b7c">版本号只在 SKILL.md 写一次，其余文件由 bump 同步，package 校验通过才出包</text>

  <!-- column 1: workspace -->
  <rect x="24" y="78" width="248" height="200" rx="12" fill="#f7f9fc" stroke="#d6dee8"/>
  <text x="42" y="104" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2933">调研工作区 {topic_slug}/</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12" fill="#3d4b5a">
    <text x="42" y="130">outline.yaml</text>
    <text x="42" y="152">fields.yaml</text>
    <text x="42" y="174">results/item_N.yaml</text>
    <text x="42" y="196">review.yaml</text>
    <text x="42" y="218">report.md</text>
  </g>
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5b6b7c">
    <text x="42" y="244">Phase 1 条目 + 档位 + 确认状态</text>
    <text x="42" y="262">Phase 3 证据（URL/日期/类型）</text>
  </g>

  <line x1="276" y1="178" x2="304" y2="178" stroke="#93a3b5" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- column 2: toolchain -->
  <rect x="310" y="78" width="248" height="200" rx="12" fill="#ffffff" stroke="#d6dee8"/>
  <text x="328" y="104" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2933">scripts/drp.py</text>
  <g font-family="Consolas, Menlo, monospace" font-size="11">
    <rect x="328" y="118" width="212" height="26" rx="6" fill="#eef4ff" stroke="#b9cdf5"/>
    <text x="338" y="136" fill="#1d4ed8">validate + selfcheck</text>
    <rect x="328" y="152" width="212" height="26" rx="6" fill="#eef4ff" stroke="#b9cdf5"/>
    <text x="338" y="170" fill="#1d4ed8">bump --level auto</text>
    <rect x="328" y="186" width="212" height="26" rx="6" fill="#fff7ed" stroke="#f0b429"/>
    <text x="338" y="204" fill="#b45309">package（校验不过即中止）</text>
  </g>
  <text x="328" y="238" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5b6b7c">P0/P1 命中 → 退出码 1，不出包</text>
  <text x="328" y="258" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5b6b7c">P2 记入 warnings，不阻断</text>

  <line x1="562" y1="178" x2="590" y2="178" stroke="#93a3b5" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- column 3: dist -->
  <rect x="596" y="78" width="260" height="200" rx="12" fill="#f0f9f4" stroke="#9ed3b4"/>
  <text x="614" y="104" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2933">dist/ 发布三件套</text>
  <g font-family="Consolas, Menlo, monospace" font-size="11" fill="#2f5d45">
    <text x="614" y="130">deep-research-plus-vX.Y.Z.zip</text>
    <text x="614" y="152">SHA256SUMS.txt</text>
    <text x="614" y="174">release-notes-vX.Y.Z.md</text>
  </g>
  <line x1="614" y1="190" x2="838" y2="190" stroke="#c7e3d4"/>
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#3d4b5a">
    <text x="614" y="212">zip 内含 BUILD-MANIFEST.json</text>
    <text x="614" y="232">逐文件 sha256 + 字节数</text>
    <text x="614" y="252">可直接挂到 GitHub Release</text>
  </g>
  <text x="24" y="308" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5b6b7c">同名产物重复构建：先删 dist/ 内旧 zip，或由 CI 以 tag 重建，保证 SHA256 与 manifest 一致</text>
</svg>
